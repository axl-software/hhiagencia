<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HHA Digital Solutions | Web, Automatización y Marketing</title>
    <meta name="description" content="Ayudamos a marcas, creadores y empresas con contenido, estrategias, automatizaciones y soluciones digitales. Región de Valparaíso (Quinta Región) y alrededores." />
    <meta name="theme-color" content="#05070A" />
    <!-- igual que TEMA_SCRIPT en src/lib/tema.ts -->
    <script>(function(){var t;try{t=localStorage.getItem('tema')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.dataset.theme=t})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
